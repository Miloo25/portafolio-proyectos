<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024">
  <defs>
    <!-- Degradado Verde Emerald de alta calidad -->
    <linearGradient id="gradienteVerde" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Sombra suave para la letra C -->
    <filter id="sombraC" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Círculo Base HD -->
  <circle cx="256" cy="256" r="236" fill="url(#gradienteVerde)" />

  <!-- Letra C Estilizada -->
  <text 
    x="256" 
    y="335" 
    font-family="'Montserrat', 'Arial Black', sans-serif" 
    font-weight="900" 
    font-size="280" 
    fill="#FFFFFF" 
    stroke="#0f172a" 
    stroke-width="12" 
    stroke-linejoin="round" 
    text-anchor="middle" 
    filter="url(#sombraC)"
  >C</text>
</svg>
